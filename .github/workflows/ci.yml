name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_PASSWORD: ci-only-disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_ADMIN_URL: postgresql+asyncpg://postgres:ci-only-disposable@localhost:5432/postgres
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: pip install --require-hashes -r requirements.lock -r requirements-test.lock && pip install --no-deps -e ../../libs/inventory && pip install --no-deps -e .
      - run: python -m pytest -q -rs

  inventory-and-local-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r local-agent/requirements.lock && pip install --no-deps -e libs/inventory -e local-agent
      - run: python -m pytest -q -rs libs/inventory/tests
      # Linux runners can create symlinks, so the symlink-escape tests run here (they skip on unprivileged Windows).
      - run: python -m pytest -q -rs local-agent/tests
      - run: python -m pytest -q -rs scan-runner/tests

  # Real pinned scanner images against a synthetic fixture repo (the dev PC runs no Docker; this job is where container
  # behaviour is verified). Its report is the evidence a reviewer uses before setting reviewed_by in images.lock.
  scanner-live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r apps/api/requirements.lock && pip install --no-deps -e libs/inventory -e apps/api
      - run: docker build -t sp-pip-audit:ci scanners/images/pip-audit
      - run: docker build -t sp-semgrep:ci scanners/images/semgrep
      - run: python scripts/scanner_live_check.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner-live-report
          path: scanner-live-report.json

  # Playwright against the real API + a seeded throwaway database (every push to main; Phase 5 decision).
  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_PASSWORD: ci-only-disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_ADMIN_URL: postgresql+asyncpg://postgres:ci-only-disposable@localhost:5432/postgres
      SP_ENVIRONMENT: development
      SP_COOKIE_SECURE: "false"
      SP_MASTER_KEY_FILE: /tmp/sp/master_key
      SP_REDACTION_SALT_FILE: /tmp/sp/redaction_salt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: pip install --require-hashes -r apps/api/requirements.lock && pip install --no-deps -e libs/inventory -e apps/api
      - name: Seed and start the API
        run: |
          mkdir -p /tmp/sp && head -c 32 /dev/urandom | base64 > /tmp/sp/master_key && head -c 48 /dev/urandom | base64 > /tmp/sp/redaction_salt
          export SP_DATABASE_URL="$(python scripts/e2e_seed.py apps/web/e2e/.creds.json | tail -n 1)"
          cd apps/api && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/sp/api.log 2>&1 &
      - working-directory: apps/web
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: nohup npx next dev -H 127.0.0.1 -p 3000 > /tmp/sp/web.log 2>&1 &
      - run: |
          for i in $(seq 90); do curl -sf http://127.0.0.1:8000/api/health >/dev/null && curl -sf -o /dev/null http://127.0.0.1:3000/login && exit 0; sleep 2; done
          echo "servers did not start"; tail -n 50 /tmp/sp/api.log /tmp/sp/web.log; exit 1
      - working-directory: apps/web
        run: npx playwright test
      - if: failure()
        run: tail -n 100 /tmp/sp/api.log /tmp/sp/web.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  repo-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Actions pinned by SHA
        run: python3 scripts/check_action_pins.py
      - name: Gitleaks (checksum-pinned binary)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --exit-code 1 .
      - name: OSV-Scanner (checksum-pinned binary)
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          # *.lock is not a name OSV v2 recognises; the "requirements.txt:" prefix names the parser explicitly.
          ./osv-scanner scan source --lockfile requirements.txt:apps/api/requirements.lock \
            --lockfile requirements.txt:apps/api/requirements-test.lock \
            --lockfile requirements.txt:local-agent/requirements.lock --lockfile apps/web/package-lock.json
