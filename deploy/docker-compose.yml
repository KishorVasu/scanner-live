# Security Platform. One Linux host. See docs/SELF_HOSTED_DEPLOYMENT.md.
# Rule R8: only scan-runner may ever get a container runtime socket. It is not mounted here; the opt-in override
# docker-compose.scan-exec.yml adds it to scan-runner alone once the server is approved to run scans.

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-api-env: &api-env
  SP_ENVIRONMENT: production
  SP_DATABASE_URL: postgresql+asyncpg://platform_app@postgres:5432/platform
  SP_DATABASE_PASSWORD_FILE: /run/secrets/pg_app_password
  SP_REDIS_URL: redis://redis:6379/0
  SP_REDIS_PASSWORD_FILE: /run/secrets/redis_password
  SP_MASTER_KEY_FILE: /run/secrets/master_key
  SP_REDACTION_SALT_FILE: /run/secrets/redaction_salt
  SP_ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
  # All outbound HTTPS goes through fetch-proxy's allowlist; internal services are reached directly.
  HTTPS_PROXY: http://fetch-proxy:3128
  HTTP_PROXY: http://fetch-proxy:3128
  NO_PROXY: scan-runner,tempo,localhost,127.0.0.1
  # Phase 6 tracing (app/core/tracing.py redacts every span before export).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    cap_add: [NET_BIND_SERVICE]
    ports: ["443:443", "80:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    networks: [public, app]
    depends_on: [web, api]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m, pids: 200 } } }

  web:
    <<: *hardening
    user: "1000:1000"
    build: ../apps/web
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 30s
    deploy: { resources: { limits: { cpus: "1", memory: 512m, pids: 200 } } }

  api:
    <<: *hardening
    user: "10001:10001"
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment: *api-env
    secrets: [pg_app_password, master_key, redaction_salt, redis_password]
    networks: [app, data, fetch, monitoring]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
    deploy: { resources: { limits: { cpus: "1", memory: 512m, pids: 200 } } }

  migrate:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["sh", "-c", "SP_MIGRATION_DATABASE_URL=postgresql+asyncpg://platform_owner:$$(cat /run/secrets/pg_owner_password)@postgres:5432/platform alembic upgrade head"]
    secrets: [pg_owner_password]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  worker:
    <<: *hardening
    user: "10001:10001"
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: sp-worker
      # Prefork children write metric files here; the main process serves the merged view on :9100.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
    secrets: [pg_app_password, master_key, redaction_salt, redis_password, anthropic_api_key]
    networks: [data, scan-control, fetch, monitoring]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "--timeout", "10"]
      interval: 60s
    deploy: { resources: { limits: { cpus: "2", memory: 1g, pids: 300 } } }

  beat:
    <<: *hardening
    user: "10001:10001"
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *api-env
    secrets: [pg_app_password, master_key, redaction_salt, redis_password]
    networks: [data]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os;assert os.path.exists('/tmp/celerybeat-schedule')"]
      interval: 60s
    deploy: { resources: { limits: { cpus: "0.25", memory: 256m, pids: 100 } } }

  scan-runner:
    <<: *hardening
    user: "10001:10001"
    build: { context: .., dockerfile: scan-runner/Dockerfile }
    networks: [scan-control]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m, pids: 100 } } }

  # Allowlisting forward proxy for api and worker: advisory feeds, GitHub API, Anthropic API (Phase 4 decision 1).
  fetch-proxy:
    <<: *hardening
    image: ubuntu/squid:6.6-24.04_edge@sha256:d9c34c5ab74c6dd41cf1070d9b4221aac072e67e983527ca2d41512958f77506
    user: "13:13"
    entrypoint: ["squid", "-N", "-f", "/etc/squid/squid.conf"]
    tmpfs: ["/tmp", "/var/spool/squid", "/var/log/squid", "/run"]
    volumes:
      - ./fetch-proxy/squid.conf:/etc/squid/squid.conf:ro
    networks: [fetch, fetch-egress]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 60s
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m, pids: 100 } } }

  # Allowlisting forward proxy: the only egress for scanner and DB-sync containers (docs/SCANNING_STRATEGY.md §4.1).
  # Runs unprivileged as the image's proxy user (uid 13); 3128 needs no capability.
  scan-proxy:
    <<: *hardening
    image: ubuntu/squid:6.6-24.04_edge@sha256:d9c34c5ab74c6dd41cf1070d9b4221aac072e67e983527ca2d41512958f77506
    user: "13:13"
    entrypoint: ["squid", "-N", "-f", "/etc/squid/squid.conf"]
    tmpfs: ["/tmp", "/var/spool/squid", "/var/log/squid", "/run"]
    volumes:
      - ./scan-proxy/squid.conf:/etc/squid/squid.conf:ro
    networks: [scan, scan-egress]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]  # no pid file, so `squid -k check` cannot work
      interval: 60s
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m, pids: 100 } } }

  # ---- Phase 6 observability (OQ-8). Internal network only; Grafana is published on the host loopback and reached
  # through an SSH tunnel (SELF_HOSTED_DEPLOYMENT.md §9). None of these get project data beyond metrics and traces.
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
    deploy: { resources: { limits: { cpus: "0.5", memory: 512m, pids: 100 } } }

  # Distroless image (no shell): its health is Prometheus' `up{job="tempo"}`, not a container healthcheck.
  tempo:
    <<: *hardening
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [monitoring]
    deploy: { resources: { limits: { cpus: "0.5", memory: 512m, pids: 100 } } }

  grafana:
    <<: *hardening
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    secrets: [grafana_admin_password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana_data:/var/lib/grafana
    # Loopback only: ssh -L 3001:127.0.0.1:3001 <server>, then http://localhost:3001.
    ports: ["127.0.0.1:3001:3000"]
    networks: [monitoring, grafana-host]
    depends_on: [prometheus, tempo]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
    deploy: { resources: { limits: { cpus: "0.5", memory: 512m, pids: 200 } } }

  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: platform_owner
      POSTGRES_DB: platform
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_owner_password
    secrets: [pg_owner_password, pg_app_password, pg_readonly_password]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_owner -d platform"]
      interval: 10s
    deploy: { resources: { limits: { cpus: "2", memory: 2g, pids: 300 } } }

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly no --save ''"]
    secrets: [redis_password]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep PONG"]
      interval: 10s
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m, pids: 100 } } }

networks:
  public: {}
  app: { internal: true }
  data: { internal: true }
  scan-control: { internal: true }
  # api and worker reach the internet only through fetch-proxy (deploy/fetch-proxy/squid.conf allowlist).
  fetch: { internal: true }
  # Outbound for fetch-proxy alone.
  fetch-egress: {}
  # Scanner and DB-sync containers (started by scan-runner by network name, hence fixed names). Internal: the only
  # way out is scan-proxy.
  scan: { internal: true, name: sp-scan }
  # Outbound for scan-proxy alone, so api/worker cannot use the proxy.
  scan-egress: { name: sp-scan-egress }
  # Prometheus, Tempo, Grafana, plus api and worker (scrape and OTLP). No route out.
  monitoring: { internal: true }
  # Only so Docker can publish Grafana on 127.0.0.1; nothing else joins it.
  grafana-host: {}

volumes:
  pg_data: {}
  # Offline vulnerability DBs: written only by scan-runner's sync jobs, mounted read-only into scans.
  sp-vulndb-osv: { name: sp-vulndb-osv }
  sp-vulndb-trivy: { name: sp-vulndb-trivy }
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
  tempo_data: {}
  grafana_data: {}

secrets:
  pg_owner_password: { file: ./secrets/pg_owner_password }
  pg_app_password: { file: ./secrets/pg_app_password }
  pg_readonly_password: { file: ./secrets/pg_readonly_password }
  master_key: { file: ./secrets/master_key }
  redaction_salt: { file: ./secrets/redaction_salt }
  redis_password: { file: ./secrets/redis_password }
  anthropic_api_key: { file: ./secrets/anthropic_api_key }
  grafana_admin_password: { file: ./secrets/grafana_admin_password }
