# Isolated load-test stack (deploy/server/load_test.sh). Own Postgres, own API, own internal network, separate
# project name: it never touches the live database or the live platform_app role (scripts/e2e_seed.py resets that
# role's password, so it must only ever run here). Same image and limits as the production api, so the numbers
# measure the server against the budget.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

services:
  lt-postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_PASSWORD: ${LT_PG_PASSWORD:?generated by load_test.sh}
    networks: [lt]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
    deploy: { resources: { limits: { cpus: "2", memory: 2g, pids: 300 } } }

  lt-api:
    <<: *hardening
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    user: "10001:10001"
    environment:
      SP_ENVIRONMENT: development
      SP_COOKIE_SECURE: "false"
      SP_MASTER_KEY_FILE: /work/master_key
      SP_REDACTION_SALT_FILE: /work/redaction_salt
    command: ["sh", "-c", "SP_DATABASE_URL=$$(cat /work/app_url) exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes: ["${LT_WORK:?}:/work:ro"]
    networks: [lt]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 2s
      retries: 30
    deploy: { resources: { limits: { cpus: "1", memory: 512m, pids: 200 } } }

  # Seeds and drives the test. Runs the repository's scripts read-only from the API image.
  lt-runner:
    <<: *hardening
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    user: "10001:10001"
    environment:
      E2E_ADMIN_URL: postgresql+asyncpg://postgres:${LT_PG_PASSWORD}@lt-postgres:5432/postgres
      SP_ENVIRONMENT: development
      SP_MASTER_KEY_FILE: /work/master_key
      SP_REDACTION_SALT_FILE: /work/redaction_salt
    working_dir: /work
    volumes:
      - ${LT_WORK:?}:/work
      - ../..:/repo:ro
    networks: [lt]
    profiles: [runner]

networks:
  lt: { internal: true }
