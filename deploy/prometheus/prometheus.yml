# Internal network only (deploy/docker-compose.yml `monitoring`). Caddy never routes /metrics.
global:
  scrape_interval: 30s
scrape_configs:
  - job_name: api
    metrics_path: /metrics/
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9100"] }]
  - job_name: tempo
    static_configs: [{ targets: ["tempo:3200"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["127.0.0.1:9090"] }]
