# Opt-in: lets scan-runner start scanner containers (rule R8: the only service that ever gets the socket).
# Use only after images.lock entries are reviewed (reviewed_by set) and the scan network allowlist is in place:
#   DOCKER_GID=$(getent group docker | cut -d: -f3) \
#   docker compose -f docker-compose.yml -f docker-compose.scan-exec.yml up -d scan-runner
# ponytail: the raw socket is root-equivalent on the host; scan-runner's fixed templates and digest allowlist are the
# control. A socket proxy or rootless runtime is the upgrade (docs/SECURITY_REVIEW.md, accepted item).
services:
  scan-runner:
    environment:
      SP_RUNNER_EXECUTE: "1"
      # Optional gVisor (install runsc and register it in /etc/docker/daemon.json first; SELF_HOSTED_DEPLOYMENT.md §14).
      SP_SCANNER_RUNTIME: ${SP_SCANNER_RUNTIME:-}
    group_add: ["${DOCKER_GID:?set DOCKER_GID to the host docker group id}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
