# fetch-proxy: the only way out for api and worker (advisory feeds, GitHub, Anthropic). Phase 4 decision 1.
# HTTPS CONNECT to port 443 of the hosts below; everything else is denied. No TLS interception, no caching.
# Changing this list is a reviewed change, like images.lock.

http_port 3128

acl allowed_hosts dstdomain api.osv.dev
acl allowed_hosts dstdomain www.cisa.gov
acl allowed_hosts dstdomain services.nvd.nist.gov
acl allowed_hosts dstdomain api.github.com
acl allowed_hosts dstdomain api.anthropic.com
acl https_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !https_port
http_access allow CONNECT allowed_hosts
http_access deny all

# No cache, no identifying headers.
cache deny all
cache_mem 0 MB
via off
forwarded_for delete

# Host, status and size only: no URL paths (CONNECT has none) and no bodies.
logformat sp %ts %>a %rm %ru %>Hs %<st
access_log stdio:/dev/stdout sp
cache_log stdio:/dev/stderr
cache_store_log none
pid_filename none
coredump_dir /tmp
shutdown_lifetime 1 seconds
