# Single-binary Tempo 3.1 (layout from upstream example/docker-compose/single-binary at v3.1.1), local storage,
# OTLP over HTTP only. Default block retention applies; spans are redacted by the API before export.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: info
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
